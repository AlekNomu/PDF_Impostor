[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pdf-impostor"
version = "1.0.0"
description = "Logiciel d'imposition PDF pour carnets et Agendas"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alek", email = "alex.borsu@gmail.com" }]
keywords = ["pdf", "imposition", "printing", "booklet", "magazine"]

dependencies = [
    "pypdf>=4.0.0",
    "tkinterdnd2>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pyinstaller>=6.0",
]

[project.scripts]
pdf-impostor = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["impostor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
